<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="华西第二医院互联网医院在线问诊与健康科普服务。"
    />
    <title>华西二院·互联网医院</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hospital-stage" id="main-content">
      <div class="hospital-shell">
        <header class="hospital-hero">
          <div class="hospital-status" aria-label="状态栏，12点32分">
            <time>12:32</time>
            <img src="./assets/status.svg" alt="" width="64" height="11" />
          </div>

          <div class="hospital-titlebar">
            <div class="hospital-brand">
              <img
                src="./assets/hospital.png"
                alt="华西二院院徽"
                width="32"
                height="32"
              />
              <strong>华西二院·互联网医院</strong>
            </div>
            <img
              src="./assets/system-menu.svg"
              alt="小程序菜单"
              width="79"
              height="30"
            />
          </div>

          <form class="hospital-search" id="hospital-search">
            <img src="./assets/sparkle.svg" alt="" width="21" height="21" />
            <input
              id="hospital-query"
              aria-label="搜索症状、科室或医生"
              placeholder="描述症状、科室或医生"
            />
            <button type="submit" aria-label="开始搜索">
              <img
                src="./assets/search-button.svg"
                alt=""
                width="32"
                height="32"
              />
              <img
                src="./assets/search-arrow.svg"
                alt=""
                width="13"
                height="13"
              />
            </button>
          </form>
        </header>

        <div class="hospital-content">
          <section class="hospital-card departments-card" aria-label="常用科室">
            <button
              type="button"
              class="department-item"
              data-notice="已选择儿科"
            >
              <span class="department-image">
                <img
                  src="./assets/department-pediatrics.svg"
                  alt=""
                  width="44"
                  height="44"
                />
              </span>
              <span>儿科</span>
            </button>
            <button
              type="button"
              class="department-item"
              data-notice="已选择妇科"
            >
              <span class="department-image">
                <img
                  src="./assets/department-gynecology.png"
                  alt=""
                  width="44"
                  height="44"
                />
              </span>
              <span>妇科</span>
            </button>
            <button
              type="button"
              class="department-item"
              data-notice="已选择产科"
            >
              <span class="department-image">
                <img
                  src="./assets/department-obstetrics.png"
                  alt=""
                  width="44"
                  height="44"
                />
              </span>
              <span>产科</span>
            </button>
            <button
              type="button"
              class="department-item"
              data-notice="已选择全部科室"
            >
              <span class="department-image">
                <img
                  src="./assets/department-all.png"
                  alt=""
                  width="44"
                  height="44"
                />
              </span>
              <span>全部科室</span>
            </button>
          </section>

          <section class="hospital-card visit-card" aria-label="便捷就医">
            <div class="visit-benefits">
              <span>
                <img src="./assets/correct.svg" alt="" width="12" height="12" />
                科学智能匹配
              </span>
              <span>
                <img src="./assets/correct.svg" alt="" width="12" height="12" />
                便捷问诊服务
              </span>
              <span>
                <img src="./assets/correct.svg" alt="" width="12" height="12" />
                专家资源丰富
              </span>
            </div>
            <div class="visit-grid">
              <button
                type="button"
                class="visit-item visit-item-1"
                data-notice="团队问诊服务即将开启"
              >
                <img
                  src="./assets/visit-team.png"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>团队问诊</strong><span>首席专家团队</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-2"
                data-notice="线上问诊服务即将开启"
              >
                <img
                  src="./assets/visit-online.png"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>线上问诊</strong><span>24小时接诊</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-3"
                data-notice="预约问诊服务即将开启"
              >
                <img
                  src="./assets/visit-appointment.png"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>预约问诊</strong><span>预约时段问诊</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-4"
                data-notice="极速问诊服务即将开启"
              >
                <img
                  src="./assets/visit-express.png"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>极速问诊</strong><span>10分钟应答</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-5"
                data-notice="门特专区服务即将开启"
              >
                <img
                  src="./assets/visit-special.svg"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>门特专区</strong><span>线上门特续方</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-6"
                data-notice="自助开单服务即将开启"
              >
                <img
                  src="./assets/visit-order.svg"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>自助开单</strong><span>在线开检查</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-7"
                data-notice="自制药服务即将开启"
              >
                <img
                  src="./assets/visit-medicine.svg"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>自制药</strong><span>自制药申请</span>
              </button>
              <button
                type="button"
                class="visit-item visit-item-8"
                data-notice="上门服务即将开启"
              >
                <img
                  src="./assets/visit-home-care.svg"
                  alt=""
                  width="44"
                  height="44"
                />
                <strong>上门服务</strong><span>专业上门服务</span>
              </button>
            </div>
          </section>

          <section class="hospital-card zone-card">
            <h2>特色专区</h2>
            <div class="zone-scroller">
              <button
                type="button"
                class="zone-item zone-pink"
                data-notice="儿童血液专区"
              >
                <img
                  src="./assets/zone-child.png"
                  alt=""
                  width="52"
                  height="52"
                />
                <span>儿童血液专区</span>
              </button>
              <button
                type="button"
                class="zone-item zone-peach"
                data-notice="儿童呼吸专区"
              >
                <img
                  src="./assets/zone-pediatric.png"
                  alt=""
                  width="52"
                  height="52"
                />
                <span>儿童呼吸专区</span>
              </button>
              <button
                type="button"
                class="zone-item zone-blue"
                data-notice="待开发专区"
              >
                <img
                  src="./assets/zone-genetic.png"
                  alt=""
                  width="52"
                  height="52"
                />
                <span>待开发专区</span>
              </button>
              <button
                type="button"
                class="zone-item zone-blue"
                data-notice="待开发专区"
              >
                <img
                  src="./assets/zone-pregnancy.png"
                  alt=""
                  width="52"
                  height="52"
                />
                <span>待开发专区</span>
              </button>
            </div>
          </section>

          <button
            type="button"
            class="hospital-banner"
            data-notice="早孕门诊活动详情"
            aria-label="查看早孕门诊活动"
          >
            <img
              src="./assets/banner.png"
              alt="早孕门诊，照亮新生命最初旅程"
              width="694"
              height="150"
            />
            <span class="banner-dots" aria-hidden="true"
              ><i></i><i></i><i></i
            ></span>
          </button>

          <section class="hospital-card feature-card">
            <h2>特色服务</h2>
            <div class="feature-grid">
              <button type="button" data-notice="健康义诊服务即将开启">
                <img
                  src="./assets/service-health.svg"
                  alt=""
                  width="34"
                  height="34"
                />
                <span>健康义诊</span>
              </button>
              <button type="button" data-notice="药品查询服务即将开启">
                <img
                  src="./assets/service-medicine.svg"
                  alt=""
                  width="34"
                  height="34"
                />
                <span>药品查询</span>
              </button>
              <button type="button" data-notice="线上MDT服务即将开启">
                <img
                  src="./assets/service-video.svg"
                  alt=""
                  width="34"
                  height="34"
                />
                <span>线上MDT</span>
              </button>
              <button type="button" data-notice="特色咨询服务即将开启">
                <img
                  src="./assets/service-chat.svg"
                  alt=""
                  width="34"
                  height="34"
                />
                <span>特色咨询</span>
              </button>
            </div>
          </section>

          <section class="hospital-card science-card">
            <div class="science-heading">
              <h2>科普推荐</h2>
              <button type="button" data-notice="查看更多科普文章">
                <span>更多</span>
                <img src="./assets/more.svg" alt="" width="18" height="16" />
              </button>
            </div>
            <div class="science-filters" role="tablist" aria-label="科普分类">
              <button
                type="button"
                role="tab"
                aria-selected="true"
                class="active"
              >
                全部
              </button>
              <button type="button" role="tab" aria-selected="false">
                检查检验
              </button>
              <button type="button" role="tab" aria-selected="false">
                孕期营养
              </button>
              <button type="button" role="tab" aria-selected="false">
                孕期保健
              </button>
            </div>

            <div class="article-list">
              <article class="article-item">
                <div class="article-copy">
                  <h3>妊娠高血糖不用饿肚子！华西产科医生揭秘“长胎不长肉”</h3>
                  <div class="article-tags">
                    <span class="tag-accent">◆ 置顶</span>
                    <span class="tag-accent">多学科诊疗</span>
                  </div>
                </div>
                <div class="article-image">
                  <img
                    src="./assets/article-nutrition.png"
                    alt=""
                    width="100"
                    height="80"
                  />
                </div>
              </article>

              <article class="article-item">
                <div class="article-copy">
                  <h3>无创DNA vS 羊水穿刺：如何选择适合的产前筛查方式</h3>
                  <div class="article-tags">
                    <span>产前诊断</span><span class="tag-accent">孕中期</span>
                  </div>
                </div>
                <div class="article-image">
                  <img
                    src="./assets/article-amniocentesis.png"
                    alt=""
                    width="100"
                    height="80"
                  />
                </div>
                <div class="article-meta">
                  <time datetime="2026-02-23">2026-02-23</time>
                  <span class="article-count">
                    <img src="./assets/eye.svg" alt="" width="16" height="16" />
                    2.3K
                    <button type="button" class="like-button" aria-label="点赞">
                      <img
                        src="./assets/thumb.svg"
                        alt=""
                        width="16"
                        height="16"
                      />
                      <span>2.3K</span>
                    </button>
                  </span>
                </div>
              </article>

              <article class="article-item">
                <div class="article-copy">
                  <h3>孕期检查时间表：从建档到分娩的完整产检指南</h3>
                  <div class="article-tags"><span>产检指南</span></div>
                </div>
                <div class="article-image">
                  <img
                    src="./assets/article-checkup.png"
                    alt=""
                    width="100"
                    height="80"
                  />
                </div>
                <div class="article-meta">
                  <time datetime="2026-02-23">2026-02-23</time>
                  <span class="article-count">
                    <img src="./assets/eye.svg" alt="" width="16" height="16" />
                    2.3K
                    <button type="button" class="like-button" aria-label="点赞">
                      <img
                        src="./assets/thumb.svg"
                        alt=""
                        width="16"
                        height="16"
                      />
                      <span>2.3K</span>
                    </button>
                  </span>
                </div>
              </article>

              <article class="article-item">
                <div class="article-copy">
                  <h3>孕期营养补充指南：叶酸、钙片、DHA怎么吃才科学？</h3>
                  <div class="article-tags">
                    <span>产前诊断</span><span class="tag-accent">孕中期</span>
                  </div>
                </div>
                <div class="article-image">
                  <img
                    src="./assets/article-dna.png"
                    alt=""
                    width="100"
                    height="80"
                  />
                </div>
                <div class="article-meta">
                  <time datetime="2026-02-23">2026-02-23</time>
                  <span class="article-count">
                    <img src="./assets/eye.svg" alt="" width="16" height="16" />
                    2.3K
                    <button type="button" class="like-button" aria-label="点赞">
                      <img
                        src="./assets/thumb.svg"
                        alt=""
                        width="16"
                        height="16"
                      />
                      <span>2.3K</span>
                    </button>
                  </span>
                </div>
              </article>
            </div>
          </section>
        </div>

        <button
          type="button"
          class="hospital-assistant"
          data-notice="华华助手正在为您服务"
        >
          <span>
            <img
              src="./assets/assistant.png"
              alt="华华助手"
              width="42"
              height="42"
            />
          </span>
          <small>华华助手</small>
        </button>

        <nav class="hospital-bottom-nav" aria-label="互联网医院功能导航">
          <button type="button" class="active" data-nav-label="最近咨询">
            <span class="nav-icon">
              <img
                src="./assets/nav-chat.svg"
                alt=""
                width="24"
                height="24"
              /><i></i>
            </span>
            <small>最近咨询</small>
          </button>
          <button type="button" data-nav-label="我的关注">
            <span class="nav-icon">
              <img src="./assets/nav-star.svg" alt="" width="24" height="24" />
            </span>
            <small>我的关注</small>
          </button>
          <button type="button" data-nav-label="问诊订单">
            <span class="nav-icon">
              <img src="./assets/nav-file.svg" alt="" width="24" height="24" />
            </span>
            <small>问诊订单</small>
          </button>
          <button type="button" data-nav-label="我的客服">
            <span class="nav-icon">
              <img
                src="./assets/nav-service.svg"
                alt=""
                width="24"
                height="24"
              />
            </span>
            <small>我的客服</small>
          </button>
        </nav>

        <div class="hospital-home-indicator" aria-hidden="true"></div>
        <div
          class="hospital-toast"
          id="hospital-toast"
          role="status"
          hidden
        ></div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
